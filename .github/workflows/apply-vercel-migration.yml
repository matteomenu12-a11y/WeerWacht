name: Apply WeerWacht Vercel migration
on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: Temporary URL of the verified migration archive
        required: true
        type: string
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply migration
        env:
          ARCHIVE_URL: ${{ inputs.archive_url }}
        shell: python
        run: |
          import hashlib
          import io
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          import zipfile
          url = os.environ['ARCHIVE_URL']
          parsed = urllib.parse.urlparse(url)
          assert parsed.scheme == 'https' and parsed.hostname == 'sdmntprnortheu.oaiusercontent.com'
          data = urllib.request.urlopen(url, timeout=30).read()
          assert hashlib.sha256(data).hexdigest() == 'a7cebe5aef0ddbba9c47d11e3ceca511a6ee87e58610b49591f49e54146231c8'
          expected = {'app/api/account/route.ts','app/api/admin/push-config/route.ts','app/api/admin/route.ts','app/api/announcements/route.ts','app/api/notifications/check/route.ts','app/api/notifications/route.ts','app/api/weather/route.ts','app/auth/callback/route.ts','app/auth/signout/route.ts','app/chatgpt-auth.ts','app/instellingen/settings.tsx','app/login/page.tsx','app/site-navigation.tsx','app/weather-app.tsx','lib/push-server.ts','lib/supabase-server.ts','lib/weather-server.ts','package.json'}
          root = pathlib.Path.cwd().resolve()
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert archive.testzip() is None
              assert set(archive.namelist()) == expected
              for name in sorted(expected):
                  target = (root / name).resolve()
                  assert target.is_relative_to(root)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(name))
          (root / 'db/index.ts').unlink()
          (root / '.github/workflows/apply-vercel-migration.yml').unlink()
      - name: Commit converted application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Run WeerWacht on Vercel with Supabase Auth and RLS"
          git push origin HEAD:main
